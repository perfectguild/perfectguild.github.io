<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="page.title"></title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/app/postcard.css">
    <link rel="stylesheet" href="/app/screenshot-scene.css">
    <noscript><style>button#controls-launcher { display: none; }</style></noscript>
  </head>
  <body>
    <main id="postcard" data-i18n-aria-label="page.postcard">
      <h1 class="visually-hidden" data-i18n="page.title"></h1>
      <canvas id="edge-fog" aria-hidden="true" hidden></canvas>
      <div id="postcard-surface">
        <img id="logo1" src="/images/stranniki_bg_v4.jpg" width="1920" height="1080" draggable="false" data-i18n-alt="page.image" alt="">
        <canvas id="ensemble-canvas" aria-hidden="true" hidden></canvas>
        <div id="nickname-targets"></div>
      </div>
    </main>
    <section id="character-card" role="region" tabindex="-1" data-i18n-aria-label="card.title" hidden></section>
    <aside id="prototype-controls" class="prototype-controls" data-floating="false" data-i18n-aria-label="page.controls" hidden>
      <div id="controls-header" class="prototype-heading">
        <h2 id="controls-drag" tabindex="0" data-i18n="controls.settings" data-i18n-aria-label="controls.move" data-i18n-title="controls.move" aria-describedby="controls-move-help"></h2>
        <span id="technology" data-i18n="technology.loading"></span>
        <div class="controls-window-actions">
          <!-- MDI dock-left and window-close, @mdi/svg 7.4.47, Apache-2.0. Paths unchanged. See LICENSE-mdi.txt. -->
          <button id="controls-dock" type="button" aria-controls="prototype-controls" data-i18n-aria-label="controls.dock" data-i18n-title="controls.dock">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M20 4H4A2 2 0 0 0 2 6V18A2 2 0 0 0 4 20H20A2 2 0 0 0 22 18V6A2 2 0 0 0 20 4M20 18H9V6H20Z"/>
            </svg>
          </button>
          <button id="controls-hide" type="button" aria-controls="prototype-controls" data-i18n-aria-label="controls.hide" data-i18n-title="controls.hide">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M13.46,12L19,17.54V19H17.54L12,13.46L6.46,19H5V17.54L10.54,12L5,6.46V5H6.46L12,10.54L17.54,5H19V6.46L13.46,12Z"/>
            </svg>
          </button>
        </div>
      </div>
      <span id="controls-move-help" class="visually-hidden" data-i18n="controls.moveHelp"></span>
      <div class="controls-row">
        <button id="autoplay" type="button" aria-pressed="false" data-i18n="controls.start" disabled></button>
        <button id="original" type="button" data-i18n="controls.original" disabled></button>
        <label class="nickname-picker-label" for="nickname-picker" data-i18n="controls.nickname"></label>
        <select id="nickname-picker" disabled></select>
        <button id="show-nickname" type="button" aria-controls="character-card" data-i18n="controls.inspect" disabled></button>
      </div>
      <output id="state" class="prototype-state" aria-live="off" data-i18n="status.original"></output>
      <div id="announcement" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
      <div class="controls-settings">
        <div class="pulse-count-control">
          <label for="pulse-count" data-i18n="controls.pulseCount"></label>
          <input id="pulse-count" type="range" min="1" max="29" value="12" aria-describedby="pulse-count-value" disabled>
          <output id="pulse-count-value" for="pulse-count" aria-live="off">12</output>
        </div>
        <div class="highlight-control">
          <label class="nickname-picker-label" for="highlight-style" data-i18n="controls.highlight"></label>
          <select id="highlight-style" disabled>
            <option value="0" data-i18n="highlight.forum"></option>
            <option value="1" data-i18n="highlight.frost"></option>
            <option value="2" data-i18n="highlight.gold"></option>
            <option value="3" data-i18n="highlight.arcane"></option>
            <option value="4" data-i18n="highlight.silver" selected></option>
            <option value="5" data-i18n="highlight.liquid"></option>
            <option value="6" data-i18n="highlight.gem"></option>
          </select>
        </div>
        <div class="highlight-control">
          <label class="nickname-picker-label" for="light-effect" data-i18n="controls.lightEffect"></label>
          <select id="light-effect" disabled>
            <option value="0" data-i18n="effect.none"></option>
            <option value="1" data-i18n="effect.breath"></option>
            <option value="2" data-i18n="effect.sweep" selected></option>
            <option value="3" data-i18n="effect.flow"></option>
            <option value="4" data-i18n="effect.sparks"></option>
          </select>
        </div>
        <div class="highlight-control">
          <label class="nickname-picker-label" for="edge-style" data-i18n="controls.edgeStyle"></label>
          <select id="edge-style" disabled>
            <option value="7" data-i18n="edge.fullFlow" selected></option>
            <option value="1" data-i18n="edge.mist"></option>
            <option value="2" data-i18n="edge.waves"></option>
            <option value="3" data-i18n="edge.silver"></option>
            <option value="4" data-i18n="edge.curls"></option>
            <option value="5" data-i18n="edge.haze"></option>
            <option value="6" data-i18n="edge.breath"></option>
            <option value="0" data-i18n="edge.blur"></option>
          </select>
        </div>
        <label class="screenshot-toggle">
          <input id="memory-enabled" type="checkbox" checked disabled>
          <span data-i18n="memory.enabled"></span>
        </label>
        <div class="highlight-control">
          <label class="nickname-picker-label" for="memory-count" data-i18n="memory.count"></label>
          <select id="memory-count" aria-describedby="memory-count-help" disabled>
            <option value="1" data-i18n="memory.countOne"></option>
            <option value="2" data-i18n="memory.countTwo"></option>
            <option value="3" data-i18n="memory.countThree" selected></option>
          </select>
          <span id="memory-count-help" class="visually-hidden" data-i18n="memory.countHelp"></span>
        </div>
        <div class="highlight-control">
          <label class="nickname-picker-label" for="memory-reveal" data-i18n="memory.reveal"></label>
          <select id="memory-reveal" disabled>
            <option value="3" data-i18n="memory.revealOriginal"></option>
            <option value="0" data-i18n="memory.revealFog" selected></option>
            <option value="1" data-i18n="memory.revealWave"></option>
            <option value="2" data-i18n="memory.revealDust"></option>
          </select>
        </div>
        <div class="highlight-control">
          <label class="nickname-picker-label" for="memory-viewer-effect" data-i18n="memory.viewerEffect"></label>
          <select id="memory-viewer-effect" disabled>
            <option value="0" data-i18n="memory.viewerOriginal"></option>
            <option value="1" data-i18n="memory.viewerFog" selected></option>
            <option value="2" data-i18n="memory.viewerWave"></option>
            <option value="3" data-i18n="memory.viewerDust"></option>
            <option value="4" data-i18n="memory.viewerRipples"></option>
          </select>
        </div>
        <div class="highlight-control">
          <label class="nickname-picker-label" for="memory-viewer-target" data-i18n="memory.viewerTarget"></label>
          <select id="memory-viewer-target" disabled>
            <option value="0" data-i18n="memory.targetColor"></option>
            <option value="1" data-i18n="memory.targetImage"></option>
            <option value="2" data-i18n="memory.targetBoth" selected></option>
          </select>
        </div>
        <details id="prototype-help" class="prototype-details">
          <summary data-i18n="controls.help"></summary>
          <p class="prototype-note" data-i18n="page.description"></p>
          <p class="prototype-note" data-i18n="page.edgeDescription"></p>
          <p class="prototype-note" data-i18n="memory.help"></p>
          <p class="prototype-note"><a href="https://discord.gg/F6UyV4Ss7v" target="_blank" rel="noopener noreferrer" data-i18n="controls.discord"></a></p>
        </details>
        <details id="prototype-sources" class="prototype-details">
          <summary data-i18n="controls.sources"></summary>
          <p id="source-note" class="prototype-note"></p>
          <p class="prototype-note">
            <span data-i18n="controls.iconCredit"></span>
            <a href="https://pictogrammers.com/library/mdi/icon/cog/" target="_blank" rel="noopener noreferrer">Material Design Icons · cog (Google)</a>
            · <a href="https://pictogrammers.com/library/mdi/icon/dock-left/" target="_blank" rel="noopener noreferrer">dock-left</a>
            · <a href="https://pictogrammers.com/library/mdi/icon/window-close/" target="_blank" rel="noopener noreferrer">window-close</a>
            · <a href="/LICENSE-mdi.txt" target="_blank" rel="noopener noreferrer">Apache-2.0</a>
          </p>
        </details>
      </div>
    </aside>
    <button id="controls-launcher" type="button" aria-controls="prototype-controls" aria-expanded="false" data-i18n-aria-label="controls.show" data-i18n-title="controls.show">
      <!-- MDI cog (Google), @mdi/svg 7.4.47, Apache-2.0. Path unchanged; accessible wrapper adapted. See LICENSE-mdi.txt. -->
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.34 19.43,11L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.96 19.05,5.05L16.56,6.05C16.04,5.66 15.5,5.32 14.87,5.07L14.5,2.42C14.46,2.18 14.25,2 14,2H10C9.75,2 9.54,2.18 9.5,2.42L9.13,5.07C8.5,5.32 7.96,5.66 7.44,6.05L4.95,5.05C4.73,4.96 4.46,5.05 4.34,5.27L2.34,8.73C2.21,8.95 2.27,9.22 2.46,9.37L4.57,11C4.53,11.34 4.5,11.67 4.5,12C4.5,12.33 4.53,12.65 4.57,12.97L2.46,14.63C2.27,14.78 2.21,15.05 2.34,15.27L4.34,18.73C4.46,18.95 4.73,19.03 4.95,18.95L7.44,17.94C7.96,18.34 8.5,18.68 9.13,18.93L9.5,21.58C9.54,21.82 9.75,22 10,22H14C14.25,22 14.46,21.82 14.5,21.58L14.87,18.93C15.5,18.67 16.04,18.34 16.56,17.94L19.05,18.95C19.27,19.03 19.54,18.95 19.66,18.73L21.66,15.27C21.78,15.05 21.73,14.78 21.54,14.63L19.43,12.97Z"/>
      </svg>
    </button>
    <noscript><p class="no-script-note"><a href="https://discord.gg/F6UyV4Ss7v" target="_blank" rel="noopener noreferrer" data-i18n="controls.discord"></a></p></noscript>
    <script type="module" src="/app/postcard.mjs"></script>
  </body>
</html>
