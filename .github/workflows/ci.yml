name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Site and tooling (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out public repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts
      - name: Check the site, documentation, and tooling
        run: npm run check

  supply-chain:
    name: Workflows and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out public repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download checksum-pinned validators
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/validators"
          gh release download v1.7.12 --repo rhysd/actionlint --pattern actionlint_1.7.12_linux_amd64.tar.gz --dir "$RUNNER_TEMP/validators"
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern gitleaks_8.30.1_linux_x64.tar.gz --dir "$RUNNER_TEMP/validators"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/validators/actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum -c -
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/validators/gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/validators/actionlint_1.7.12_linux_amd64.tar.gz" -C "$RUNNER_TEMP/validators" actionlint
          tar -xzf "$RUNNER_TEMP/validators/gitleaks_8.30.1_linux_x64.tar.gz" -C "$RUNNER_TEMP/validators" gitleaks
      - name: Check workflow syntax
        run: '"$RUNNER_TEMP/validators/actionlint"'
      - name: Scan the public checkout for secrets
        run: '"$RUNNER_TEMP/validators/gitleaks" dir . --config .gitleaks.toml --redact --no-banner'
